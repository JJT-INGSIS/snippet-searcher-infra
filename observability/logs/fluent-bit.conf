@INCLUDE /fluent-bit/etc/license.conf

[SERVICE]
    Flush                     5
    Log_Level                 warn
    Parsers_File              /fluent-bit/etc/parsers-ingress.conf
    storage.path              /fluent-bit/state/buffer
    storage.sync              normal
    storage.backlog.mem_limit 8M

[INPUT]
    Name           systemd
    Tag            ingress
    Systemd_Filter CONTAINER_TAG=snippet-ingress
    Read_From_Tail On
    DB             /fluent-bit/state/ingress.db
    Mem_Buf_Limit  8M
    storage.type   filesystem

[INPUT]
    Name           systemd
    Tag            kernel
    Systemd_Filter _TRANSPORT=kernel
    Read_From_Tail On
    DB             /fluent-bit/state/kernel.db
    Mem_Buf_Limit  2M
    storage.type   filesystem

[INPUT]
    Name           systemd
    Tag            docker
    Systemd_Filter _SYSTEMD_UNIT=docker.service
    Read_From_Tail On
    DB             /fluent-bit/state/docker.db
    Mem_Buf_Limit  2M
    storage.type   filesystem

[FILTER]
    Name     parser
    Match    ingress
    Key_Name MESSAGE
    Parser   ingress_json

[FILTER]
    Name  grep
    Match ingress
    Regex request_id ^[a-f0-9]{32}$

[FILTER]
    Name          record_modifier
    Match         ingress
    Record        logtype nginx-ingress
    Record        environment ${SNIPPET_ENVIRONMENT}
    Record        service nginx
    Allowlist_key time
    Allowlist_key request_id
    Allowlist_key method
    Allowlist_key path
    Allowlist_key route
    Allowlist_key status
    Allowlist_key bytes_sent
    Allowlist_key request_time
    Allowlist_key upstream
    Allowlist_key upstream_status
    Allowlist_key upstream_connect_time
    Allowlist_key upstream_response_time
    Allowlist_key logtype
    Allowlist_key environment
    Allowlist_key service

[FILTER]
    Name  grep
    Match kernel
    Regex MESSAGE (Out of memory|oom-kill|oom_reaper|Killed process)

[FILTER]
    Name          record_modifier
    Match         kernel
    Record        logtype host-kernel
    Record        environment ${SNIPPET_ENVIRONMENT}
    Record        service host
    Allowlist_key MESSAGE
    Allowlist_key PRIORITY
    Allowlist_key logtype
    Allowlist_key environment
    Allowlist_key service

[FILTER]
    Name  grep
    Match docker
    Regex PRIORITY ^[0-4]$

[FILTER]
    Name          record_modifier
    Match         docker
    Record        logtype host-docker
    Record        environment ${SNIPPET_ENVIRONMENT}
    Record        service docker
    Allowlist_key MESSAGE
    Allowlist_key PRIORITY
    Allowlist_key logtype
    Allowlist_key environment
    Allowlist_key service

[OUTPUT]
    Name                     nrlogs
    Match                    *
    base_uri                 https://log-api.newrelic.com/log/v1
    license_key              ${NR_LICENSE_KEY}
    compress                 gzip
    Retry_Limit              5
    storage.total_limit_size 256M
