name: snippet-searcher-infra

x-http-destinations: &http-destinations
  PERMISSIONS_BASE_URL: ${PERMISSIONS_BASE_URL:-http://permissions-service:8080}
  PRINTSCRIPT_BASE_URL: ${PRINTSCRIPT_BASE_URL:-http://printscript-service:8080}

services:
  snippets-service:
    build:
      context: ../snippets-service
      secrets:
        - github_actor
        - github_token
    environment:
      <<: *http-destinations
      SPRING_DATASOURCE_URL: jdbc:postgresql://snippets-db:5432/snippets
      SPRING_DATASOURCE_USERNAME: snippets
      SPRING_DATASOURCE_PASSWORD: ${SNIPPETS_DB_PASSWORD:?Definir SNIPPETS_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      snippets-db:
        condition: service_healthy

  snippets-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: snippets
      POSTGRES_USER: snippets
      POSTGRES_PASSWORD: ${SNIPPETS_DB_PASSWORD:?Definir SNIPPETS_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${SNIPPETS_DB_PORT:-5432}:5432"
    volumes:
      - snippets_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  permissions-service:
    build:
      context: ../permissions-service
      secrets:
        - github_actor
        - github_token
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://permissions-db:5432/permissions
      SPRING_DATASOURCE_USERNAME: permissions
      SPRING_DATASOURCE_PASSWORD: ${PERMISSIONS_DB_PASSWORD:?Definir PERMISSIONS_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      permissions-db:
        condition: service_healthy

  permissions-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: permissions
      POSTGRES_USER: permissions
      POSTGRES_PASSWORD: ${PERMISSIONS_DB_PASSWORD:?Definir PERMISSIONS_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${PERMISSIONS_DB_PORT:-5433}:5432"
    volumes:
      - permissions_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  printscript-service:
    build:
      context: ../printscript-service
      secrets:
        - github_actor
        - github_token
    ports:
      - "127.0.0.1:8082:8080"

  smoke-tests:
    image: python:3.13-alpine
    profiles: [verification]
    environment: *http-destinations
    volumes:
      - ./scripts:/verification:ro
    command: ["python", "-B", "/verification/smoke_tests.py"]
    depends_on:
      snippets-service:
        condition: service_started
      permissions-service:
        condition: service_started
      printscript-service:
        condition: service_started

secrets:
  github_actor:
    environment: GITHUB_ACTOR
  github_token:
    environment: GITHUB_TOKEN

volumes:
  snippets_data:
  permissions_data:
