worker_processes auto;
pid /tmp/nginx.pid;

# Per-request errors can contain raw querystrings. Access logs below deliberately
# omit URL, query, headers and bodies; retain only fatal configuration diagnostics.
error_log /dev/stderr emerg;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format ingress '$request_id method=$request_method status=$status '
                       'upstream_status=$upstream_status duration=$request_time '
                       'upstream_duration=$upstream_response_time';
    access_log /dev/stdout ingress;

    # Docker embedded DNS. A short bounded cache permits container replacement
    # and starting the proxy before an upstream exists. No task IP is hardcoded.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream snippets_backend {
        zone snippets_backend 64k;
        server snippets-service:8080 resolve;
    }
    upstream ui_backend {
        zone ui_backend 64k;
        server ui:8080 resolve;
    }
    map $uri $external_prefix {
        ~^/api(?:/|$) /api;
        default "";
    }

    client_max_body_size 8m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_http_version 1.1;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_cache off;

    # Default proxy_redirect applies per location. It is not a general URL
    # rewrite; backends must honor the canonical host/relative URL contract.
    include /etc/nginx/conf.d/*.conf;
}
