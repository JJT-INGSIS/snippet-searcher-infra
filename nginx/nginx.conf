worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr emerg;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    map $uri $ingress_route {
        ~^/api/executions/ executions;
        ~^/api(?:/|$) api;
        default ui;
    }
    log_format ingress escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
                                   '"method":"$request_method","path":"$uri","route":"$ingress_route",'
                                   '"status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,'
                                   '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
                                   '"upstream_connect_time":"$upstream_connect_time",'
                                   '"upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout ingress;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream snippets_backend {
        zone snippets_backend 64k;
        server snippets-service:8080 resolve;
    }
    upstream ui_backend {
        zone ui_backend 64k;
        server ui:8080 resolve;
    }
    map $uri $external_prefix {
        ~^/api(?:/|$) /api;
        default "";
    }

    client_max_body_size 8m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_http_version 1.1;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_cache off;

    include /etc/nginx/conf.d/*.conf;
}
