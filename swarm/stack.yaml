version: "3.8"

x-app-deploy: &app-deploy
  replicas: 1
  resources:
    limits:
      memory: 768M
    reservations:
      memory: 256M
  restart_policy:
    condition: any
    delay: 10s
  update_config:
    parallelism: 1
    order: start-first
    monitor: 60s
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: stop-first

services:
  snippets-service:
    image: ${SNIPPETS_IMAGE:?Definir SNIPPETS_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV:?Definir DEPLOY_ENV}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://snippets-db:5432/snippets
      SPRING_DATASOURCE_USERNAME: snippets
      PERMISSIONS_BASE_URL: http://permissions-service:8080
      PRINTSCRIPT_BASE_URL: http://printscript-service:8080
      STORAGE_LOCAL_DIRECTORY: /var/lib/snippets/content
    volumes:
      - snippets_content:/var/lib/snippets/content
    secrets:
      - source: snippets_db_password
        target: spring.datasource.password
    ports:
      - target: 8080
        published: 8080
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; read -t 5 -r line <&3; [[ \"$$line\" == HTTP/* ]]'"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 90s
    deploy: *app-deploy

  permissions-service:
    image: ${PERMISSIONS_IMAGE:?Definir PERMISSIONS_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV:?Definir DEPLOY_ENV}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://permissions-db:5432/permissions
      SPRING_DATASOURCE_USERNAME: permissions
    secrets:
      - source: permissions_db_password
        target: spring.datasource.password
    ports:
      - target: 8080
        published: 8081
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; read -t 5 -r line <&3; [[ \"$$line\" == *\" 200 \"* ]]'"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 90s
    deploy: *app-deploy

  printscript-service:
    image: ${PRINTSCRIPT_IMAGE:?Definir PRINTSCRIPT_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV:?Definir DEPLOY_ENV}
    ports:
      - target: 8080
        published: 8082
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; read -t 5 -r line <&3; [[ \"$$line\" == HTTP/* ]]'"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 90s
    deploy: *app-deploy

  snippets-db:
    image: ${POSTGRES_IMAGE:?Definir POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: snippets
      POSTGRES_USER: snippets
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: snippets_db_password
        target: db_password
    volumes:
      - snippets_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      placement:
        constraints: [node.labels.database == true]
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first

  permissions-db:
    image: ${POSTGRES_IMAGE:?Definir POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: permissions
      POSTGRES_USER: permissions
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: permissions_db_password
        target: db_password
    volumes:
      - permissions_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      placement:
        constraints: [node.labels.database == true]
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first

secrets:
  snippets_db_password:
    external: true
  permissions_db_password:
    external: true

volumes:
  snippets_data:
  permissions_data:
  snippets_content:
