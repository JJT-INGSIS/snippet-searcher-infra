# SNI-38 HTTP candidate. NOT consumed by bootstrap/CD until SNI-43 integration.
# Mirrors stack.yaml except application ports; validation rejects unrelated drift.
# UI service belongs to SNI-42. DNS permits starting before ui:8080 exists.
version: "3.8"

x-app-deploy: &app-deploy
  replicas: 1
  resources:
    limits:
      memory: 768M
    reservations:
      memory: 256M
  restart_policy:
    condition: any
    delay: 10s
  update_config:
    parallelism: 1
    order: start-first
    monitor: 60s
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: stop-first

services:
  nginx:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    entrypoint: [sh, /etc/nginx/validate-env.sh]
    command: [nginx, -g, "daemon off;"]
    environment:
      PROXY_HOSTNAME: ${PROXY_HOSTNAME:?Definir PROXY_HOSTNAME del ambiente}
      PROXY_PUBLIC_PORT: "80"
      NGINX_ENVSUBST_FILTER: ^(PROXY_HOSTNAME|PROXY_PUBLIC_PORT)$$
    ports:
      - target: 8080
        published: 80
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_main
        target: /etc/nginx/nginx.conf
      - source: nginx_routes
        target: /etc/nginx/templates/default.conf.template
      - source: nginx_env_check
        target: /etc/nginx/validate-env.sh
    volumes:
      - ingress_acme:/var/www/acme:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        order: start-first
        monitor: 30s
        failure_action: rollback
      rollback_config:
        order: stop-first

  snippets-service:
    image: ${SNIPPETS_IMAGE:?Definir SNIPPETS_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV:?Definir DEPLOY_ENV}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://snippets-db:5432/snippets
      SPRING_DATASOURCE_USERNAME: snippets
      PERMISSIONS_BASE_URL: http://permissions-service:8080
      PRINTSCRIPT_BASE_URL: http://printscript-service:8080
      STORAGE_LOCAL_DIRECTORY: /var/lib/snippets/content
    volumes:
      - snippets_content:/var/lib/snippets/content
    secrets:
      - source: snippets_db_password
        target: spring.datasource.password
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; read -t 5 -r line <&3; [[ \"$$line\" == HTTP/* ]]'"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 90s
    deploy: *app-deploy

  permissions-service:
    image: ${PERMISSIONS_IMAGE:?Definir PERMISSIONS_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV:?Definir DEPLOY_ENV}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://permissions-db:5432/permissions
      SPRING_DATASOURCE_USERNAME: permissions
    secrets:
      - source: permissions_db_password
        target: spring.datasource.password
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; read -t 5 -r line <&3; [[ \"$$line\" == *\" 200 \"* ]]'"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 90s
    deploy: *app-deploy

  printscript-service:
    image: ${PRINTSCRIPT_IMAGE:?Definir PRINTSCRIPT_IMAGE}
    environment:
      SPRING_PROFILES_ACTIVE: ${DEPLOY_ENV:?Definir DEPLOY_ENV}
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; read -t 5 -r line <&3; [[ \"$$line\" == HTTP/* ]]'"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 90s
    deploy: *app-deploy

  snippets-db:
    image: ${POSTGRES_IMAGE:?Definir POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: snippets
      POSTGRES_USER: snippets
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: snippets_db_password
        target: db_password
    volumes:
      - snippets_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      placement:
        constraints: [node.labels.database == true]
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first

  permissions-db:
    image: ${POSTGRES_IMAGE:?Definir POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: permissions
      POSTGRES_USER: permissions
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: permissions_db_password
        target: db_password
    volumes:
      - permissions_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      placement:
        constraints: [node.labels.database == true]
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first

secrets:
  snippets_db_password:
    external: true
  permissions_db_password:
    external: true

volumes:
  snippets_data:
  permissions_data:
  snippets_content:
  ingress_acme:

configs:
  nginx_main:
    name: snippet-searcher-${DEPLOY_ENV}_nginx_main_v1
    file: ../nginx/nginx.conf
  nginx_routes:
    name: snippet-searcher-${DEPLOY_ENV}_nginx_routes_v1
    file: ../nginx/templates/ingress.conf.template
  nginx_env_check:
    name: snippet-searcher-${DEPLOY_ENV}_nginx_env_check_v1
    file: ../nginx/validate-env.sh
