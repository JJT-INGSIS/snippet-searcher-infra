# DNS aliases keep native New Relic remote entity names distinct across environments.
# Additive candidate only; the SNI-80 agent must join this private network.
version: "3.8"
services:
  snippets-db:
    networks:
      default:
        aliases: ["${DEPLOY_ENV:?Definir DEPLOY_ENV}-snippets-db"]
  permissions-db:
    networks:
      default:
        aliases: ["${DEPLOY_ENV:?Definir DEPLOY_ENV}-permissions-db"]
networks:
  default: {}
